<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post 04 · fairdata · tags da capa (vidro)</title>
<!-- Tags da capa inspiradas em botões de vidro com degradê desfocado, nas cores da fairdata.
     Cada .tag vira um PNG transparente (render-tags.js) para colar no Canva. -->
<style>
  body { margin: 0; padding: 40px; background: transparent; font-family: "Inter", sans-serif; display: flex; flex-direction: column; align-items: flex-start; gap: 40px; }
  .caixa { padding: 26px 30px 36px; display: inline-block; }
  .tag {
    position: relative; display: inline-flex; align-items: center; gap: 14px;
    height: 58px; padding: 0 30px 0 26px; border-radius: 999px; overflow: hidden;
    font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: #1E1E1E; white-space: nowrap;
    background: #FFF8E6;
    border: 1.5px solid rgba(255, 255, 255, .95);
    box-shadow: 0 12px 28px rgba(120, 90, 10, .28), 0 2px 6px rgba(0, 0, 0, .12), inset 0 1px 0 rgba(255, 255, 255, .9);
  }
  /* manchas de cor desfocadas, como nas referências */
  .tag::before, .tag::after { content: ""; position: absolute; border-radius: 50%; filter: blur(16px); z-index: 0; }
  .tag::before { width: 46%; height: 160%; left: -8%; top: -30%; background: #FFBE25; opacity: .85; }
  .tag::after { width: 40%; height: 120%; right: -6%; bottom: -55%; background: #FFFFFF; opacity: .95; }
  .tag .brilho { position: absolute; z-index: 0; width: 34%; height: 140%; right: 4%; top: -40%; border-radius: 50%; filter: blur(18px); background: #F3D9A8; opacity: .9; }
  .tag span, .tag svg { position: relative; z-index: 1; }
  .tag svg { width: 20px; height: 20px; flex: none; }
</style>
</head>
<body>
  <div class="caixa" id="t-mapa"><div class="tag"><i class="brilho"></i>
    <svg viewBox="0 0 20 20"><rect x="1" y="1" width="8" height="8" rx="2" fill="#1E1E1E"/><rect x="11" y="1" width="8" height="8" rx="2" fill="#1E1E1E" opacity=".45"/><rect x="1" y="11" width="8" height="8" rx="2" fill="#1E1E1E" opacity=".45"/><rect x="11" y="11" width="8" height="8" rx="2" fill="#1E1E1E"/></svg>
    <span>Mapa de calor para gestão</span></div></div>
  <div class="caixa" id="t-seg"><div class="tag"><i class="brilho"></i>
    <svg viewBox="0 0 20 20"><path d="M10 1.5 17 4.2v5.2c0 4.3-3 7.6-7 9.1-4-1.5-7-4.8-7-9.1V4.2Z" fill="#1E1E1E"/></svg>
    <span>Segurança psicológica para liderança</span></div></div>
  <div class="caixa" id="t-copsoq"><div class="tag"><i class="brilho"></i>
    <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#1E1E1E"/><path d="M5.8 10.3 8.6 13l5.6-5.8" fill="none" stroke="#FFF8E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>COPSOQ para NR-1</span></div></div>
</body>
</html>
