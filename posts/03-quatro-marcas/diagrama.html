<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FairJob · 4 marcas em 1 slide · diagrama</title>
<!-- Círculo dividido nas 4 marcas, com a FairJob no centro. Renderizado com
     fundo transparente para ir ao Canva como imagem; o post.html mostra o
     slide inteiro para revisão. -->
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; font-family: "Inter", sans-serif; }
  .verbo { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .desc  { font-size: 19px; font-weight: 500; fill: #4A4A4A; }
</style>
</head>
<body>
<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <!-- quatro partes de um mesmo círculo -->
  <path transform="translate(-6 -6)" d="M450 450 L10 450 A440 440 0 0 1 450 10 Z"  fill="#F4E7C0"/>
  <path transform="translate(6 -6)"  d="M450 450 L450 10 A440 440 0 0 1 890 450 Z" fill="#D2ECE5"/>
  <path transform="translate(6 6)"   d="M450 450 L890 450 A440 440 0 0 1 450 890 Z" fill="#E6DCF4"/>
  <path transform="translate(-6 6)"  d="M450 450 L450 890 A440 440 0 0 1 10 450 Z"  fill="#D6E3F4"/>

  <!-- a FairJob no centro -->
  <circle cx="450" cy="450" r="112" fill="#FFFCF3"/>
  <image href="../assets/logos/fairjob.png" x="378" y="378" width="144" height="144"/>

  <g text-anchor="middle">
    <image href="../assets/logos/fairdata.png" x="203" y="112" width="84" height="84"/>
    <text class="verbo" x="245" y="246" fill="#8A6A12">Medir</text>
    <text class="desc" x="245" y="280">Revela a causa-raiz</text>
    <text class="desc" x="245" y="304">dos indicadores de</text>
    <text class="desc" x="245" y="328">gente, com impacto</text>
    <text class="desc" x="245" y="352">financeiro</text>

    <image href="../assets/logos/fairhealth.png" x="613" y="112" width="84" height="84"/>
    <text class="verbo" x="655" y="246" fill="#0F7366">Cuidar</text>
    <text class="desc" x="655" y="280">Medicina preventiva</text>
    <text class="desc" x="655" y="304">na empresa: reduz</text>
    <text class="desc" x="655" y="328">sinistralidade antes</text>
    <text class="desc" x="655" y="352">da doença</text>

    <image href="../assets/logos/fairedu.png" x="588" y="512" width="84" height="84"/>
    <text class="verbo" x="630" y="646" fill="#5A3189">Conscientizar</text>
    <text class="desc" x="630" y="680">Formação de líderes</text>
    <text class="desc" x="630" y="704">que levam bem-estar</text>
    <text class="desc" x="630" y="728">e resultado ao</text>
    <text class="desc" x="630" y="752">dia a dia</text>

    <image href="../assets/logos/fairtrust.png" x="228" y="512" width="84" height="84"/>
    <text class="verbo" x="270" y="646" fill="#1B5C9E">Comprovar</text>
    <text class="desc" x="270" y="680">Certifica o que a</text>
    <text class="desc" x="270" y="704">empresa faz pelo</text>
    <text class="desc" x="270" y="728">bem-estar, não o</text>
    <text class="desc" x="270" y="752">que declara</text>
  </g>
</svg>
</body>
</html>
