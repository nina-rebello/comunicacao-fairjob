<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FairJob · Diagrama do ecossistema</title>
<!-- Ilustração do CTA do carrossel 01: a FairJob no centro, as 4 marcas em ciclo ao redor.
     Renderizada com fundo transparente e colada no Canva como imagem. -->
<style>
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(../assets/fonts/InstrumentSerif-Italic.ttf); }
  html, body { margin: 0; background: transparent; }
  svg { display: block; font-family: "Inter", sans-serif; }
  .num   { font-size: 14px; font-weight: 700; letter-spacing: .14em; }
  .verbo { font-size: 30px; font-weight: 800; letter-spacing: -.02em; fill: #1E1E1E; }
  .desc  { font-size: 18px; font-weight: 500; fill: #5F5F5F; }
  .nota  { font-family: "Instrument Serif", serif; font-style: italic; font-size: 22px; fill: #8A8A8A; }
  .orbita { font-size: 13px; font-weight: 600; fill: #9A968C; }
</style>
</head>
<body>
<svg width="860" height="410" viewBox="0 56 860 410" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- arcos do ciclo: cada um vai da cor de uma marca para a da próxima -->
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="359.7" y1="0" x2="500.3" y2="0"><stop offset="0" stop-color="#D9A521"/><stop offset="1" stop-color="#158F81"/></linearGradient>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="0" y1="189.7" x2="0" y2="330.3"><stop offset="0" stop-color="#158F81"/><stop offset="1" stop-color="#6A3D9E"/></linearGradient>
    <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="500.3" y1="0" x2="359.7" y2="0"><stop offset="0" stop-color="#6A3D9E"/><stop offset="1" stop-color="#1B5C9E"/></linearGradient>
    <linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="0" y1="330.3" x2="0" y2="189.7"><stop offset="0" stop-color="#1B5C9E"/><stop offset="1" stop-color="#D9A521"/></linearGradient>
    <marker id="m1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#158F81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#6A3D9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#1B5C9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#D9A521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <!-- esferas de fundo: brilho no centro, somem na borda -->
    <radialGradient id="r-data"><stop offset="0" stop-color="#E8B42F" stop-opacity=".30"/><stop offset="1" stop-color="#E8B42F" stop-opacity=".06"/></radialGradient>
    <radialGradient id="r-health"><stop offset="0" stop-color="#158F81" stop-opacity=".26"/><stop offset="1" stop-color="#158F81" stop-opacity=".05"/></radialGradient>
    <radialGradient id="r-edu"><stop offset="0" stop-color="#6A3D9E" stop-opacity=".24"/><stop offset="1" stop-color="#6A3D9E" stop-opacity=".05"/></radialGradient>
    <radialGradient id="r-trust"><stop offset="0" stop-color="#1B5C9E" stop-opacity=".24"/><stop offset="1" stop-color="#1B5C9E" stop-opacity=".05"/></radialGradient>
    <radialGradient id="r-hub"><stop offset=".55" stop-color="#F7C948" stop-opacity=".45"/><stop offset="1" stop-color="#F7C948" stop-opacity="0"/></radialGradient>
    <filter id="sombra" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1E1E" flood-opacity=".14"/></filter>
    <path id="orbita" d="M430 159 A101 101 0 1 1 429.99 159"/>
  </defs>

  <!-- 1. as quatro esferas se sobrepõem no centro: é ali que fica a FairJob -->
  <g>
    <circle cx="380.5" cy="210.5" r="135" fill="url(#r-data)"/>
    <circle cx="479.5" cy="210.5" r="135" fill="url(#r-health)"/>
    <circle cx="479.5" cy="309.5" r="135" fill="url(#r-edu)"/>
    <circle cx="380.5" cy="309.5" r="135" fill="url(#r-trust)"/>
  </g>
  <g fill="none" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round" opacity=".38">
    <circle cx="380.5" cy="210.5" r="135" stroke="#B8901F"/>
    <circle cx="479.5" cy="210.5" r="135" stroke="#158F81"/>
    <circle cx="479.5" cy="309.5" r="135" stroke="#6A3D9E"/>
    <circle cx="380.5" cy="309.5" r="135" stroke="#1B5C9E"/>
  </g>

  <!-- 2. o ciclo: Medir → Cuidar → Conscientizar → Comprovar → Medir -->
  <circle cx="430" cy="260" r="180" fill="none" stroke="#1E1E1E" stroke-opacity=".07" stroke-width="1"/>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M359.7 94.3 A180 180 0 0 1 500.3 94.3" stroke="url(#g1)" marker-end="url(#m1)"/>
    <path d="M595.7 189.7 A180 180 0 0 1 595.7 330.3" stroke="url(#g2)" marker-end="url(#m2)"/>
    <path d="M500.3 425.7 A180 180 0 0 1 359.7 425.7" stroke="url(#g3)" marker-end="url(#m3)"/>
    <path d="M264.3 330.3 A180 180 0 0 1 264.3 189.7" stroke="url(#g4)" marker-end="url(#m4)"/>
  </g>

  <!-- 3. a FairJob no centro, com a órbita escrita -->
  <circle cx="430" cy="260" r="118" fill="#FFFCF3" fill-opacity=".55"/>
  <circle cx="430" cy="260" r="118" fill="none" stroke="#1E1E1E" stroke-opacity=".08"/>
  <circle cx="430" cy="260" r="86" fill="#FFFCF3" stroke="#1E1E1E" stroke-opacity=".12"/>
  <text class="orbita"><textPath href="#orbita" textLength="628" lengthAdjust="spacing">GOVERNANÇA SOCIAL · UM ÚNICO ECOSSISTEMA ·</textPath></text>
  <image href="../assets/logos/fairjob.png" x="372" y="202" width="116" height="116" filter="url(#sombra)"/>

  <!-- 4. as marcas, nos quatro pontos do ciclo -->
  <g>
    <circle cx="302.7" cy="132.7" r="66" fill="#FFFCF3"/>
    <circle cx="302.7" cy="132.7" r="66" fill="#E8B42F" fill-opacity=".14" stroke="#B8901F" stroke-opacity=".5" stroke-width="1.4"/>
    <image href="../assets/logos/fairdata.png" x="254.7" y="84.7" width="96" height="96" filter="url(#sombra)"/>

    <circle cx="557.3" cy="132.7" r="66" fill="#FFFCF3"/>
    <circle cx="557.3" cy="132.7" r="66" fill="#158F81" fill-opacity=".12" stroke="#158F81" stroke-opacity=".5" stroke-width="1.4"/>
    <image href="../assets/logos/fairhealth.png" x="509.3" y="84.7" width="96" height="96" filter="url(#sombra)"/>

    <circle cx="557.3" cy="387.3" r="66" fill="#FFFCF3"/>
    <circle cx="557.3" cy="387.3" r="66" fill="#6A3D9E" fill-opacity=".12" stroke="#6A3D9E" stroke-opacity=".5" stroke-width="1.4"/>
    <image href="../assets/logos/fairedu.png" x="509.3" y="339.3" width="96" height="96" filter="url(#sombra)"/>

    <circle cx="302.7" cy="387.3" r="66" fill="#FFFCF3"/>
    <circle cx="302.7" cy="387.3" r="66" fill="#1B5C9E" fill-opacity=".12" stroke="#1B5C9E" stroke-opacity=".5" stroke-width="1.4"/>
    <image href="../assets/logos/fairtrust.png" x="254.7" y="339.3" width="96" height="96" filter="url(#sombra)"/>
  </g>

  <!-- 5. legendas: número, marca, verbo e o que ela entrega -->
  <g text-anchor="end">
    <text class="num" x="216" y="102" fill="#9A7612">01 · FAIRDATA</text>
    <text class="verbo" x="216" y="138">Medir</text>
    <text class="desc" x="216" y="166">Pesquisa, dados</text>
    <text class="desc" x="216" y="189">e plano de ação</text>

    <text class="num" x="216" y="357" fill="#1B5C9E">04 · FAIRTRUST</text>
    <text class="verbo" x="216" y="393">Comprovar</text>
    <text class="desc" x="216" y="421">Auditoria e</text>
    <text class="desc" x="216" y="444">certificação</text>

    <text class="nota" x="216" y="256">a prova gera novos dados</text>
    <text class="nota" x="216" y="282">e o ciclo recomeça</text>
  </g>
  <g text-anchor="start">
    <text class="num" x="644" y="102" fill="#0F7366">02 · FAIRHEALTH</text>
    <text class="verbo" x="644" y="138">Cuidar</text>
    <text class="desc" x="644" y="166">Médicos e psicólogos</text>
    <text class="desc" x="644" y="189">dentro da empresa</text>

    <text class="num" x="644" y="357" fill="#5A3189">03 · FAIREDU</text>
    <text class="verbo" x="644" y="393">Conscientizar</text>
    <text class="desc" x="644" y="421">Cursos, palestras</text>
    <text class="desc" x="644" y="444">e workshops</text>
  </g>
</svg>
</body>
</html>
