<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FairJob · Diagrama do ecossistema</title>
<!-- Ilustração do CTA do carrossel 01 (slide 6/6), versão simplificada: selos sem halo,
     anel fino neutro com setas no sentido do ciclo, sem texto em órbita.
     Moldura no Canva: 860 x 410 px. Renderizar com render-diagrama.js (2x -> 1720 x 820).
     Anel nas cores das marcas: ecossistema-diagrama.html?anel=cor -->
<style>
  :root {
    --fundo: #fffcf3;
    --texto: #1e1e1e;
    --texto-2: #5f5f5f;
    --anel-neutro: #c6b994;
    --data: #b8901f;
    --health: #158f81;
    --edu: #6a3d9e;
    --trust: #1b5c9e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 860px; height: 410px; background: var(--fundo); overflow: hidden; }
  body { position: relative; font-family: "Liberation Sans", Arimo, Arial, Helvetica, sans-serif; color: var(--texto); }

  svg { position: absolute; inset: 0; }

  .selo { position: absolute; }
  .selo img { position: absolute; display: block; }

  .rotulo { position: absolute; width: 216px; transform: translateY(-50%); }
  .rotulo.esq { text-align: right; }
  .rotulo.dir { text-align: left; }
  .rotulo .etapa { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.2; }
  .rotulo .verbo { font-size: 30px; font-weight: 700; line-height: 1.1; margin-top: 4px; letter-spacing: -0.01em; }
  .rotulo .desc { font-size: 17px; line-height: 1.3; color: var(--texto-2); margin-top: 6px; }
</style>
</head>
<body>
<svg id="anel" width="860" height="410" viewBox="0 0 860 410"></svg>
<div id="pecas"></div>

<script>
  const C = { x: 430, y: 205 };       // centro do ciclo
  const DX = 140, DY = 118;           // deslocamento dos selos em relação ao centro
  const R = Math.hypot(DX, DY);       // raio do anel (passa pelo centro de cada selo)
  const SELO = 92;                    // diâmetro dos selos das frentes
  const SELO_CENTRO = 116;            // diâmetro do selo FairJob
  const FOLGA = 12;                   // espaço entre o anel e a borda do selo
  const anelCor = new URLSearchParams(location.search).get('anel') === 'cor';

  // Sentido horário: Medir -> Cuidar -> Conscientizar -> Comprovar -> Medir
  const etapas = [
    { selo: 'fairdata',   n: '01', verbo: 'Medir',         desc: 'Pesquisa, dados<br>e plano de ação',           cor: 'var(--data)',   x: C.x - DX, y: C.y - DY, lado: 'esq' },
    { selo: 'fairhealth', n: '02', verbo: 'Cuidar',        desc: 'Médicos e psicólogos<br>dentro da empresa',    cor: 'var(--health)', x: C.x + DX, y: C.y - DY, lado: 'dir' },
    { selo: 'fairedu',    n: '03', verbo: 'Conscientizar', desc: 'Cursos, palestras<br>e workshops',             cor: 'var(--edu)',    x: C.x + DX, y: C.y + DY, lado: 'dir' },
    { selo: 'fairtrust',  n: '04', verbo: 'Comprovar',     desc: 'Auditoria e<br>certificação',                   cor: 'var(--trust)',  x: C.x - DX, y: C.y + DY, lado: 'esq' },
  ];

  // caixa do círculo dentro de cada PNG (px), para os selos saírem do mesmo tamanho
  const LOGOS = {
    fairdata:   { w: 193, h: 189, x0: 3,  y0: 3, x1: 189, y1: 188 },
    fairhealth: { w: 196, h: 193, x0: 11, y0: 8, x1: 189, y1: 186 },
    fairedu:    { w: 200, h: 200, x0: 1,  y0: 1, x1: 199, y1: 199 },
    fairtrust:  { w: 182, h: 181, x0: 1,  y0: 1, x1: 180, y1: 180 },
    fairjob:    { w: 996, h: 996, x0: 0,  y0: 0, x1: 996, y1: 996 },
  };
  function selo(nome, cx, cy, d) {
    const L = LOGOS[nome], k = d / Math.max(L.x1 - L.x0, L.y1 - L.y0);
    const box = document.createElement('div');
    box.className = 'selo';
    Object.assign(box.style, { width: d + 'px', height: d + 'px', left: (cx - d / 2) + 'px', top: (cy - d / 2) + 'px' });
    const img = document.createElement('img');
    img.src = `../assets/logos/${nome}.png`;
    img.alt = nome === 'fairjob' ? 'FairJob' : nome;
    Object.assign(img.style, { width: L.w * k + 'px', height: L.h * k + 'px', left: -L.x0 * k + 'px', top: -L.y0 * k + 'px' });
    box.appendChild(img);
    return box;
  }

  const svg = document.getElementById('anel');
  const pecas = document.getElementById('pecas');
  const NS = 'http://www.w3.org/2000/svg';
  const ponto = (a) => ({ x: C.x + R * Math.cos(a), y: C.y + R * Math.sin(a) });
  const meiaFolga = 2 * Math.asin((SELO / 2 + FOLGA) / (2 * R));

  etapas.forEach((e, i) => {
    const prox = etapas[(i + 1) % etapas.length];
    let a0 = Math.atan2(e.y - C.y, e.x - C.x) + meiaFolga;
    let a1 = Math.atan2(prox.y - C.y, prox.x - C.x) - meiaFolga;
    if (a1 < a0) a1 += 2 * Math.PI;
    const p0 = ponto(a0), p1 = ponto(a1);
    const cor = anelCor ? e.cor : 'var(--anel-neutro)';

    const arco = document.createElementNS(NS, 'path');
    arco.setAttribute('d', `M ${p0.x} ${p0.y} A ${R} ${R} 0 0 1 ${p1.x} ${p1.y}`);
    arco.setAttribute('fill', 'none');
    arco.setAttribute('stroke', cor);
    arco.setAttribute('stroke-width', '3');
    arco.setAttribute('stroke-linecap', 'round');
    svg.appendChild(arco);

    // ponta de seta (chevron) no fim do arco, tangente ao anel
    const t = { x: -Math.sin(a1), y: Math.cos(a1) };   // direção horária
    const nrm = { x: Math.cos(a1), y: Math.sin(a1) };
    const L = 9, W = 7;
    const seta = document.createElementNS(NS, 'path');
    seta.setAttribute('d',
      `M ${p1.x - t.x * L + nrm.x * W} ${p1.y - t.y * L + nrm.y * W} L ${p1.x} ${p1.y} L ${p1.x - t.x * L - nrm.x * W} ${p1.y - t.y * L - nrm.y * W}`);
    seta.setAttribute('fill', 'none');
    seta.setAttribute('stroke', cor);
    seta.setAttribute('stroke-width', '3');
    seta.setAttribute('stroke-linecap', 'round');
    seta.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(seta);

    pecas.appendChild(selo(e.selo, e.x, e.y, SELO));

    const r = document.createElement('div');
    r.className = `rotulo ${e.lado}`;
    r.style.top = e.y + 'px';
    r.style.left = e.lado === 'esq' ? (e.x - SELO / 2 - 22 - 216) + 'px' : (e.x + SELO / 2 + 22) + 'px';
    r.innerHTML = `<div class="etapa" style="color:${e.cor}">${e.n} · ${e.selo}</div>
                   <div class="verbo">${e.verbo}</div>
                   <div class="desc">${e.desc}</div>`;
    pecas.appendChild(r);
  });

  pecas.appendChild(selo('fairjob', C.x, C.y, SELO_CENTRO));
</script>
</body>
</html>
